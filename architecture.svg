<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" font-family="monospace">
  <rect width="800" height="420" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#fff" font-size="18" text-anchor="middle">Robot Python Bridge — Architecture</text>
  <text x="400" y="58" fill="#94a3b8" font-size="12" text-anchor="middle">Static host stays static · No backend · Playwright CDP, in-process</text>

  <!-- Left box: Browser -->
  <rect x="30" y="90" width="300" height="230" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="10"/>
  <text x="180" y="118" fill="#38bdf8" font-size="14" text-anchor="middle">BROWSER TAB</text>
  <text x="180" y="138" fill="#94a3b8" font-size="11" text-anchor="middle">GitHub Pages (static)</text>
  <text x="180" y="156" fill="#94a3b8" font-size="11" text-anchor="middle">index.html · Three.js</text>
  <text x="60" y="190" fill="#fff" font-size="12">animate() 60fps owns truth:</text>
  <text x="60" y="208" fill="#cbd5e1" font-size="11">robot.position, keys set</text>
  <text x="60" y="234" fill="#4ade80" font-size="11">OUT: postMessage(robot-state)</text>
  <text x="60" y="252" fill="#fbbf24" font-size="11">IN: on robot-command:</text>
  <text x="60" y="268" fill="#cbd5e1" font-size="11">keys.add / teleport / color</text>
  <text x="60" y="296" fill="#64748b" font-size="11">add_init_script listener +</text>
  <text x="60" y="310" fill="#64748b" font-size="11">expose_binding hook live here</text>

  <!-- Right box: Python -->
  <rect x="470" y="90" width="300" height="230" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="10"/>
  <text x="620" y="118" fill="#4ade80" font-size="14" text-anchor="middle">LOCAL PYTHON</text>
  <text x="620" y="138" fill="#94a3b8" font-size="11" text-anchor="middle">bridge.py (ordinary script)</text>
  <text x="500" y="170" fill="#fff" font-size="12">receive_state(_, data):</text>
  <text x="500" y="188" fill="#cbd5e1" font-size="11">json.loads → latest_state</text>
  <text x="500" y="204" fill="#cbd5e1" font-size="11">print only on change, ≤2/sec</text>
  <text x="500" y="230" fill="#fff" font-size="12">send(cmd):</text>
  <text x="500" y="248" fill="#cbd5e1" font-size="11">page.evaluate(postMessage</text>
  <text x="500" y="262" fill="#cbd5e1" font-size="11">  {type: robot-command})</text>
  <text x="500" y="288" fill="#64748b" font-size="11">CLI: w/a/s/d · t · c · status</text>
  <text x="500" y="302" fill="#64748b" font-size="11">HEADLESS=1 for CI / servers</text>

  <!-- UP arrow: left -> right -->
  <line x1="330" y1="160" x2="470" y2="160" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="340" y="128" width="120" height="20" fill="#052e16" rx="4"/>
  <text x="400" y="142" fill="#4ade80" font-size="11" text-anchor="middle">READ · UP</text>

  <!-- DOWN arrow: right -> left -->
  <line x1="470" y1="230" x2="330" y2="230" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowY)"/>
  <rect x="340" y="238" width="120" height="20" fill="#451a03" rx="4"/>
  <text x="400" y="252" fill="#fbbf24" font-size="11" text-anchor="middle">WRITE · DOWN</text>

  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ade80"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="400" y="350" fill="#cbd5e1" font-size="12" text-anchor="middle">Channel: Playwright (Chrome DevTools Protocol) · Event-driven, sub-second · No screenshots, no polling</text>
  <text x="400" y="370" fill="#f87171" font-size="12" text-anchor="middle">WebSocket alternative rejected: needs 24/7 server → breaks static-only rule</text>
  <text x="400" y="390" fill="#64748b" font-size="11" text-anchor="middle">Same-machine only · Remote multi-user would need WebSocket relay instead</text>
</svg>
